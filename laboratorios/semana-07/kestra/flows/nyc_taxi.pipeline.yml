id: pipeline
namespace: nyc_taxi
description: |
  Pipeline ELT completo NYC Yellow Taxi:
  1) backfill -> RAW (descarga + carga a Snowflake)
  2) dbt_build -> BRONZE, SILVER, GOLD + tests
  Puede ejecutarse N veces sin generar duplicados.

inputs:
  - id: periods
    type: ARRAY
    itemType: STRING
    defaults:
      - "2025-01"
      - "2025-02"
      - "2025-03"
      - "2025-04"
      - "2025-05"
      - "2025-06"
      - "2025-07"
      - "2025-08"
      - "2025-09"
      - "2025-10"
      - "2025-11"
      - "2025-12"
      - "2026-01"
      - "2026-02"
      - "2026-03"
      - "2026-04"
      - "2026-05"
      - "2026-06"
      - "2026-07"
      - "2026-08"

  - id: full_refresh
    type: BOOL
    defaults: false

tasks:
  - id: extract_load
    type: io.kestra.plugin.core.flow.Subflow
    namespace: nyc_taxi
    flowId: backfill
    inputs:
      periods: "{{ inputs.periods }}"
    wait: true
    transmitFailed: true

  - id: transform
    type: io.kestra.plugin.core.flow.Subflow
    namespace: nyc_taxi
    flowId: dbt_build
    inputs:
      full_refresh: "{{ inputs.full_refresh }}"
    wait: true
    transmitFailed: true

triggers:
  # TLC publica cada mes con ~2 meses de rezago: se re-ejecuta el día 5 de cada mes.
  # Deshabilitado por defecto; habilitar desde la UI si se desea automatizar.
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 5 * *"
    disabled: true
