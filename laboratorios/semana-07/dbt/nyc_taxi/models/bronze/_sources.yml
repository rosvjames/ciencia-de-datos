version: 2

sources:
  - name: raw
    description: Aterrizaje de archivos TLC cargados por Kestra (COPY INTO desde stage interno).
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'NYC_TAXI') }}"
    schema: RAW
    tables:
      - name: yellow_tripdata
        identifier: YELLOW_TRIPDATA
        description: Un registro por fila de los Parquet yellow_tripdata_YYYY-MM, sin transformar.
        config:
          loaded_at_field: _loaded_at
        columns:
          - name: _source_file
            data_tests: [not_null]
          - name: _loaded_at
            data_tests: [not_null]
